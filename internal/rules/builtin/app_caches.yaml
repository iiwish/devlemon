# DevLemon 内置清理规则。格式说明见 docs/RULES.md
# Built-in cleanup rules. See docs/RULES.md for the format.
group: app_caches
rules:
  # Xcode 开发垃圾
  - id: xcode_derived_data
    title:
      en: "Xcode DerivedData"
      zh: "Xcode 项目中间构建产物 (DerivedData)"
    description:
      en: "Intermediate build files and indexing caches generated by Xcode, safe to clean and will rebuild on next compile"
      zh: "Xcode 编译项目产生的历史中间产物与索引，删除无破坏性，下次编译按需重新生成"
    paths:
      - "~/Library/Developer/Xcode/DerivedData"
    risk: rebuildable
    min_size: 10MB

  - id: xcode_device_logs
    title:
      en: "Xcode iOS Device Logs"
      zh: "Xcode 真机调试崩溃日志 (iOS DeviceLogs)"
    description:
      en: "Crash logs synchronized from connected iOS devices"
      zh: "真机联调同步到本地的 iOS 设备历史运行与崩溃诊断日志"
    paths:
      - "~/Library/Developer/Xcode/iOS DeviceLogs"
      - "~/Library/Developer/Xcode/iOS Device Logs"
      - "~/Library/Developer/Xcode/DeviceLogs"
    risk: rebuildable
    min_size: 5MB

  - id: xcode_device_support
    title:
      en: "Xcode Device Support Files"
      zh: "Xcode 真机调试符号文件 (Device Support)"
    description:
      en: "Debug symbols copied from connected iOS/watchOS/macOS devices, one folder per OS version. Re-copied automatically the next time that device connects"
      zh: "连接真机调试时从设备拷贝的系统符号，每个系统版本一份；旧版本通常已无用，下次连接对应设备时自动重新拷贝"
    paths:
      - "~/Library/Developer/Xcode/iOS DeviceSupport"
      - "~/Library/Developer/Xcode/watchOS DeviceSupport"
      - "~/Library/Developer/Xcode/tvOS DeviceSupport"
      - "~/Library/Developer/Xcode/macOS DeviceSupport"
      - "~/Library/Developer/Xcode/visionOS DeviceSupport"
    risk: rebuildable
    min_size: 50MB

  - id: xcode_documentation_cache
    title:
      en: "Xcode Documentation Cache"
      zh: "Xcode 开发文档缓存"
    description:
      en: "Downloaded developer documentation, re-downloaded on demand"
      zh: "Xcode 下载的开发者文档缓存，按需重新下载"
    paths:
      - "~/Library/Developer/Xcode/DocumentationCache"
    risk: rebuildable
    min_size: 10MB

  # VSCode 缓存与日志
  - id: vscode_cache
    title:
      en: "Visual Studio Code Cache & Logs"
      zh: "Visual Studio Code 缓存与运行日志"
    description:
      en: "VSCode runtime cache, VSIX extension downloads, and logs"
      zh: "VSCode 运行数据缓存、扩展安装缓存及运行日志，清理后按需重建"
    paths:
      - "~/Library/Caches/com.microsoft.VSCode"
      - "~/Library/Application Support/Code/Cache"
      - "~/Library/Application Support/Code/CachedData"
      - "~/Library/Application Support/Code/CachedExtensionVSIXs"
      - "~/Library/Application Support/Code/logs"
    risk: rebuildable
    min_size: 5MB

  # Codex 客户端界面渲染与 V8 字节码缓存 (严格物理隔离，绝不碰触 ~/.codex 会话历史与 CodexBar 账单)
  - id: codex_ui_cache
    title:
      en: "Codex Client UI & Render Cache"
      zh: "Codex 桌面端界面渲染与 V8 脚本缓存"
    description:
      en: "Electron frontend render cache and V8 script bytecode. Strictly excludes ~/.codex (all conversation threads, prompts, and memories) and CodexBar (token usage database)"
      zh: "Electron 前端界面渲染缓存与 V8 脚本字节码。严格隔离保护 ~/.codex（全部会话历史、Prompt 与记忆资产）及 CodexBar（Token 账单数据库）"
    paths:
      - "~/Library/Caches/Codex"
    risk: rebuildable
    min_size: 30MB

  # 微信 WeChat (绝对安全子路径探测，严禁碰触 users/mmkv/xwechat_files 聊天与凭证数据)
  - id: wechat_app_cache
    title:
      en: "WeChat Web & Media Cache"
      zh: "微信 离线网页与临时媒体缓存"
    description:
      en: "Temporary web resources, image previews, and mini-program caches. Never touches chat history databases or login credentials (mmkv/users)"
      zh: "微信内置浏览器网页、公众号离线缓存与小程序临时图片。绝不触碰聊天记录数据库及用户登录凭证 (mmkv/users)"
    paths:
      - "~/Library/Containers/com.tencent.xinWeChat/Data/Library/Caches"
      - "~/Library/Caches/com.tencent.xinWeChat"
      - "~/Library/Containers/com.tencent.xinWeChat/Data/Documents/app_data/radium/cache"
      - "~/Library/Containers/com.tencent.xinWeChat/Data/Documents/app_data/radium/web"
      - "~/Library/Containers/com.tencent.xinWeChat/Data/tmp/wmpf_images"
      - "~/Library/Containers/com.tencent.xinWeChat/Data/tmp/wmpf_files"
      - "~/Library/Containers/com.tencent.xinWeChat/Data/tmp/TemporaryItems"
    risk: rebuildable
    min_size: 5MB

  # 企业微信 WeCom
  - id: wework_cache
    title:
      en: "WeCom (Enterprise WeChat) Cache"
      zh: "企业微信 临时运行与媒体缓存"
    description:
      en: "Temporary document preview, image thumbnails, and web caches in WeCom"
      zh: "企业微信临时文档预览、图片缩略图及网页渲染缓存"
    paths:
      - "~/Library/Containers/com.tencent.WeWorkMac/Data/Library/Caches"
    risk: rebuildable
    min_size: 2MB

  # 钉钉 DingTalk
  - id: dingtalk_cache
    title:
      en: "DingTalk Cache"
      zh: "钉钉 客户端缓存与临时文件"
    description:
      en: "Temporary web resources and media caches in DingTalk"
      zh: "钉钉网页离线缓存与多媒体传输临时文件"
    paths:
      - "~/Library/Containers/com.alibaba.DingTalkMac/Data/Library/Caches"
      - "~/Library/Application Support/DingTalkMac/Cache"
    risk: rebuildable
    min_size: 10MB

  # 飞书 Lark / Feishu
  - id: feishu_cache
    title:
      en: "Feishu / Lark Cache"
      zh: "飞书 客户端离线缓存与日志"
    description:
      en: "Web container cache and offline resources in Feishu"
      zh: "飞书文档离线缓存、网页容器资源及日志文件"
    paths:
      - "~/Library/Containers/com.electron.lark/Data/Library/Caches"
      - "~/Library/Containers/com.bytedance.ee.lark/Data/Library/Caches"
    risk: rebuildable
    min_size: 10MB

  # QQ 音乐
  - id: qqmusic_cache
    title:
      en: "QQ Music Offline Song & Cover Cache"
      zh: "QQ 音乐 离线试听与封面缓存"
    description:
      en: "Album cover art and temporary audio streaming caches"
      zh: "试听音乐的临时音频分片与专辑封面缩略图缓存"
    paths:
      - "~/Library/Containers/com.tencent.QQMusicMac/Data/Library/Caches"
    risk: rebuildable
    min_size: 10MB

  # 网易云音乐
  - id: netease_music_cache
    title:
      en: "Netease Music Audio & Cover Cache"
      zh: "网易云音乐 试听缓存与封面"
    description:
      en: "Cached streaming audio and cover graphics in Netease Music"
      zh: "网易云音乐客户端试听缓存、离线歌词与封面图"
    paths:
      - "~/Library/Caches/com.netease.163music"
    risk: rebuildable
    min_size: 10MB

  # 腾讯 QQ
  - id: qq_app_cache
    title:
      en: "Tencent QQ Temporary Cache"
      zh: "腾讯 QQ 临时图片与表情缓存"
    description:
      en: "Temporary image, sticker, and web view caches for Tencent QQ"
      zh: "QQ 聊天表情包缩略图与内置网页缓存"
    paths:
      - "~/Library/Containers/com.tencent.qq/Data/Library/Caches"
    risk: rebuildable
    min_size: 10MB

  # Apple Mail 邮件客户端缓存
  - id: apple_mail_cache
    title:
      en: "Apple Mail Attachment & Data Cache"
      zh: "系统邮件 (Mail) 离线附件与数据缓存"
    description:
      en: "Downloaded mail attachments and offline web caches in Apple Mail"
      zh: "邮件客户端自动拉取的邮件附件预览与临时缓存，清理后重新联网自动同步"
    paths:
      - "~/Library/Containers/com.apple.mail/Data/Library/Caches"
      - "~/Library/Containers/com.apple.mail/Data/Library/Mail Downloads"
    risk: rebuildable
    min_size: 5MB
