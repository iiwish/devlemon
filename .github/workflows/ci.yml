name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        go: ['1.23', '1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build CLI
        run: go build -v -o devlemon ./cmd/devlemon

      # 逐个文件校验内置清理规则，出错时直接指出文件、规则 ID 与原因
      - name: Validate cleanup rules
        run: ./devlemon rules check internal/rules/builtin/*.yaml

      - name: Test
        run: go test -v ./...
