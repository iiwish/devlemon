name: Update Homebrew Tap

# 发布完成后由 release.yml 调用；也可在 Actions 页面手动为已发布的版本补更新
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.12'
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.12'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-formula:
    name: Update iiwish/homebrew-tap formula
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # 默认的 GITHUB_TOKEN 无法推送到其他仓库；缺少令牌时直接失败，避免 tap 再次悄悄落后于正式发布
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set; cannot push to iiwish/homebrew-tap"
            exit 1
          fi

      - name: Checkout devlemon
        uses: actions/checkout@v4

      - name: Generate formula from release checksums
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p checksums.txt -O checksums.txt
          bash scripts/homebrew_formula.sh "$TAG" checksums.txt > devlemon.rb
          ruby -c devlemon.rb
          cat devlemon.rb

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: iiwish/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit and push formula
        working-directory: tap
        run: |
          # 手动补跑旧版本时绝不能把 tap 降级
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/devlemon.rb)
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "${TAG#v}" | sort -V | tail -1)
          if [[ -n "$CURRENT" && "$NEWEST" != "${TAG#v}" ]]; then
            echo "Tap already at $CURRENT, newer than ${TAG#v}; skipping"
            exit 0
          fi
          cp ../devlemon.rb Formula/devlemon.rb
          if git diff --quiet -- Formula/devlemon.rb; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "devlemon ${TAG#v}" -- Formula/devlemon.rb
          for i in 1 2 3; do
            git push origin HEAD && exit 0
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          done
          exit 1
