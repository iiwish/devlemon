name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          TAG=${GITHUB_REF#refs/tags/}
          
          PLATFORMS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
          )
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            OUTPUT_NAME="devlemon-${TAG}-${GOOS}-${GOARCH}"
            
            echo "Building for ${GOOS}/${GOARCH}..."
            env GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -ldflags="-s -w -X devlemon/internal/version.Version=${TAG}" -o "dist/devlemon" ./cmd/devlemon
            
            cd dist
            tar -czf "${OUTPUT_NAME}.tar.gz" devlemon
            rm devlemon
            cd ..
          done
          
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cd ..

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/

  build-mac-app:
    name: Build macOS DevLemon.app
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # 导入 Developer ID Application 证书到临时钥匙串。缺少证书时直接失败：
      # 临时签名的 App 每次更新都会被系统当作新应用，用户已授予的权限全部失效
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" || -z "$CERT_PASSWORD" ]]; then
            echo "::error::DEVELOPER_ID_CERT_P12 / DEVELOPER_ID_CERT_PASSWORD secrets are not set; cannot sign DevLemon.app"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Developer ID 中间证书（旧版 G1 与 G2 都导入，证书可能由任一签发），保证证书链完整、身份被判为有效
          for CA in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$CA.cer" "https://www.apple.com/certificateauthority/$CA.cer"
            security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -n 1 | awk -F'"' '{print $2}')
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No valid 'Developer ID Application' identity found in the imported certificate"
            # 列出全部身份（含无效原因），便于排查证书链或导出错误
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "DEVLEMON_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build & Sign DevLemon.app
        run: bash mac/scripts/build_app.sh

      - name: Notarize & Create macOS Release Archive
        # 公证凭据二选一：App Store Connect API 密钥（优先），或 Apple ID + App 专用密码
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: 38S76J82P4
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          if [[ -n "$NOTARY_KEY_P8" && -n "$NOTARY_KEY_ID" && -n "$NOTARY_ISSUER_ID" ]]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
            unset NOTARY_APPLE_ID NOTARY_PASSWORD
          elif [[ -z "$NOTARY_APPLE_ID" || -z "$NOTARY_PASSWORD" ]]; then
            echo "::error::Notarization credentials are not set: configure NOTARY_KEY_P8 / NOTARY_KEY_ID / NOTARY_ISSUER_ID, or NOTARY_APPLE_ID / NOTARY_PASSWORD"
            exit 1
          fi
          bash mac/scripts/notarize.sh build/DevLemon.app "dist/DevLemon-${TAG}-macOS.zip"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Generate signed Sparkle appcast.xml
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          SPARKLE_TOOL="mac/.build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          # 缺少私钥或工具时直接失败：静默跳过会让已安装的客户端永远停留在旧的更新源
          if [[ -z "$SPARKLE_KEY" ]]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set; cannot sign the Sparkle update feed"
            exit 1
          fi
          if [[ ! -x "$SPARKLE_TOOL" ]]; then
            echo "::error::generate_appcast not found at $SPARKLE_TOOL"
            exit 1
          fi
          mkdir -p sparkle_update
          cp "dist/DevLemon-${TAG}-macOS.zip" sparkle_update/
          echo "$SPARKLE_KEY" | "$SPARKLE_TOOL" \
            --download-url-prefix "https://github.com/iiwish/devlemon/releases/download/${TAG}/" \
            --ed-key-file - \
            -o dist/appcast.xml \
            sparkle_update/
          grep -q "<sparkle:version>${TAG#v}</sparkle:version>" dist/appcast.xml
          grep -q 'sparkle:edSignature=' dist/appcast.xml
          cat dist/appcast.xml

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            dist/*.zip
            dist/appcast.xml

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  publish-release:
    name: Publish GitHub Release
    needs: [build-cli, build-mac-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p release_files
          find artifacts -type f -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
          draft: false
          prerelease: false

      # 已安装的 App 通过 SUFeedURL 读取 main 分支上的 appcast.xml，发布完成后必须同步回 main
      - name: Publish appcast.xml to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp release_files/appcast.xml appcast.xml
          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(appcast): publish ${GITHUB_REF_NAME} update feed" -- appcast.xml
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1

  # 同步 Homebrew 公式，`brew install iiwish/tap/devlemon` 用户才能装到新版本
  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: publish-release
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
