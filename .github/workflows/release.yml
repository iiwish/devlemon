name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          TAG=${GITHUB_REF#refs/tags/}
          
          PLATFORMS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/amd64"
            "linux/arm64"
          )
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS=${PLATFORM%/*}
            GOARCH=${PLATFORM#*/}
            OUTPUT_NAME="devlemon-${TAG}-${GOOS}-${GOARCH}"
            
            echo "Building for ${GOOS}/${GOARCH}..."
            env GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${TAG}" -o "dist/devlemon" ./cmd/devlemon
            
            cd dist
            tar -czf "${OUTPUT_NAME}.tar.gz" devlemon
            rm devlemon
            cd ..
          done
          
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
